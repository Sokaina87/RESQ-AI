services:
  postgres:
    image: postgres:16-alpine
    container_name: resq-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: resq_ai
    ports:
      - "5432:5432"
    volumes:
      - resq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d resq_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resq_postgres_data:
